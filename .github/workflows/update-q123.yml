name: Update Q123 Data

# 실행 조건
on:
  # 2시간마다 자동 실행 (UTC 기준)
  schedule:
    - cron: '0 */2 * * *'
  # 수동 실행도 가능하게
  workflow_dispatch:

# 권한 - 리포 쓰기 필요
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch market data and calculate Q123 signals
        run: python .github/scripts/update_q123_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 변경된 게 있는지 확인
          if git diff --quiet docs/q123_data.json 2>/dev/null; then
            echo "✓ 변경사항 없음 — 푸시 스킵"
            exit 0
          fi

          # 모드 정보 읽어서 커밋 메시지에 포함
          AS_OF=$(python -c "import json; d=json.load(open('docs/q123_data.json')); print(d.get('as_of','—'))")
          MODE=$(python -c "import json; d=json.load(open('docs/q123_data.json')); print(d['mode']['current']+' '+d['mode']['asset'])")

          git add docs/q123_data.json
          git commit -m "data: Q123 시그널 자동 갱신 (${AS_OF}) — ${MODE}"
          git push
          echo "✅ 푸시 완료"
