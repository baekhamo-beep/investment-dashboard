name: Validate Q123
on:
  pull_request:
    paths: ['q123_engine.py', 'scripts/*q123*', 'scripts/telegram_client.py', 'tests/**', 'data/**', 'docs/q123*', 'fetch_data.py', 'requirements-q123.txt', '.github/workflows/test_q123.yml', '.github/workflows/*q123*telegram*']
  push:
    paths: ['q123_engine.py', 'scripts/*q123*', 'scripts/telegram_client.py', 'tests/**', 'data/**', 'docs/q123*', 'fetch_data.py', 'requirements-q123.txt', '.github/workflows/test_q123.yml', '.github/workflows/*q123*telegram*']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-q123.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_q123_ui.cjs
      - run: python scripts/build_q123.py
      - run: git diff --exit-code -- docs/q123.html docs/q123_results.json docs/q123_state.json docs/q123_transitions.csv
