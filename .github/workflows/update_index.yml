name: Update Index History

on:
  schedule:
    # 매일 KST 06:00 (UTC 21:00 전일) - 미국 장 마감 후
    - cron: '0 21 * * *'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade yfinance requests pandas

      - name: Update index data
        run: python scripts/update_index_history.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index_history.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update index history $(date -u +%Y-%m-%d)"
            git push
          fi
