name: Q123 Telegram Alerts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q123_telegram.yml'
      - 'scripts/q123_telegram.py'
      - 'scripts/telegram_client.py'
  schedule:
    # Start before the summer target (13:00 UTC); the runner waits locally.
    - cron: '43,53 12 * * 1-5'
    # Off-hour backups, winter prewarming (13:43/53), and post-open health checks.
    - cron: '3,13,23,33,43,53 13-16 * * 1-5'
    # Includes NYSE early closes as well as regular summer/winter closes.
    - cron: '7,27,47 17-22 * * 1-5'
  workflow_run:
    workflows: ['Fetch Market Data']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      wait_for_preopen:
        description: 'External scheduler: wait up to 30 minutes for the pre-open target'
        type: boolean
        default: false
      test_message:
        description: 'Send a connection test instead of checking scheduled alerts'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: q123-telegram-alerts
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance -r requirements-q123.txt
      - name: Send scheduled notices or private test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_message }}
          EARLY_RUNNER: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.wait_for_preopen) }}
        run: |
          if [ "$SEND_TEST" = "true" ]; then
            python scripts/q123_telegram.py --test
          elif [ "$EARLY_RUNNER" = "true" ]; then
            python scripts/q123_telegram.py --wait-for-preopen
          else
            python scripts/q123_telegram.py
          fi
      - name: Verify fresh market data for connection tests
        if: github.event_name == 'workflow_dispatch' && inputs.test_message
        run: |
          python - <<'PY'
          import pandas as pd
          from fetch_data import get_q123_state
          from scripts.q123_telegram import calendar_at, due_events, validate_state
          now = pd.Timestamp.now(tz='UTC')
          state = get_q123_state()
          validate_state(state, due_events(calendar_at(now), now))
          print('Fresh market state verified:', state['as_of'], state['mode'], '->', state['target_mode'])
          PY
      - name: Persist acknowledged-message receipts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/q123_alert_receipts.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist Q123 notification receipts"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
            done
            exit 1
          fi
