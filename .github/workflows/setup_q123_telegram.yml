name: Connect Q123 Telegram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup_q123_telegram.yml'
      - 'scripts/setup_q123_telegram.py'
      - 'scripts/telegram_client.py'

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.34.2
      - name: Check token and send private connection instructions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/setup_q123_telegram.py
